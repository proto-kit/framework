services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server --console-address ":9001" /mnt/data
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - '../data/minio:/mnt/data'

volumes:
  minio_data:
    driver: local
